:root{
  --ink:#3C5152;
  --paper:#FFFFFF;
  --brand:#4A9195;
  --confirm:#32B14A;
  --caution:#FEC844;
  --short:#F1592A;
  --card:#EFF3F2;
  --ink64:rgba(60,81,82,.64);
  --ink40:rgba(60,81,82,.40);
  --ink14:rgba(60,81,82,.14);
  --disp:'Space Grotesk',system-ui,Roboto,'Segoe UI',sans-serif;
  --body:system-ui,Roboto,'Segoe UI','Noto Sans',sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{background:#2E3E3F;font-family:var(--body);display:flex;align-items:center;justify-content:center}
#phone{width:390px;height:844px;background:var(--paper);color:var(--ink);position:relative;overflow:hidden;border-radius:28px;box-shadow:0 24px 64px rgba(0,0,0,.45);display:flex;flex-direction:column}
@media (max-width:430px){
  body{background:var(--paper)}
  #phone{width:100vw;height:100dvh;border-radius:0;box-shadow:none}
}
#screen{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;padding:0 20px 24px}
.hdr{position:sticky;top:0;z-index:5;background:var(--paper);display:flex;align-items:center;gap:8px;padding:14px 0 10px;min-height:56px}
.hdr .ttl{font-family:var(--disp);font-weight:700;font-size:19px;flex:1;font-variant-numeric:tabular-nums}
.hdr .brandmark{font-family:var(--disp);font-weight:700;font-size:21px;flex:1;letter-spacing:.01em}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus-visible,a:focus-visible,input:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--brand);outline-offset:2px;border-radius:6px}
.iconbtn{min-width:44px;min-height:44px;display:inline-flex;align-items:center;justify-content:center;font-size:20px;border-radius:10px}
.langbtn{min-height:44px;padding:0 10px;display:inline-flex;align-items:center;gap:4px;font-family:var(--disp);font-weight:700;font-size:13px;letter-spacing:.06em;border:1.5px solid var(--ink14);border-radius:10px}
.display{font-family:var(--disp);font-weight:700;font-variant-numeric:tabular-nums}
.h-xl{font-size:40px;line-height:44px;letter-spacing:-.01em}
.h-l{font-size:26px;line-height:32px}
.h-m{font-size:19px;line-height:26px}
.body-s{font-size:13px;line-height:18px}
.muted{color:var(--ink64)}
p,li,label{font-size:16px;line-height:24px}
.stack>*+*{margin-top:16px}
.stack-s>*+*{margin-top:8px}
.card{background:var(--card);border-radius:14px;padding:16px;border:1px solid var(--ink14)}
.btn{display:flex;align-items:center;justify-content:center;width:100%;min-height:52px;background:var(--brand);color:#fff;font-family:var(--disp);font-weight:700;font-size:19px;border-radius:14px;padding:0 20px}
.btn:active{filter:brightness(.93)}
.btn-quiet{display:flex;align-items:center;justify-content:space-between;width:100%;min-height:52px;background:var(--card);border:1px solid var(--ink14);border-radius:14px;padding:0 16px;font-size:16px;text-align:left;gap:8px}
.btn-line{display:inline-flex;align-items:center;min-height:44px;font-size:16px;text-decoration:underline;text-decoration-color:var(--brand);text-decoration-thickness:2px;text-underline-offset:4px}
.row{display:flex;align-items:center;justify-content:space-between;gap:8px}
.prov{display:inline-flex;align-items:center;gap:5px;font-size:11px;line-height:14px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink64);min-height:44px;min-width:44px;margin:-10px -6px;padding:0 6px;border-radius:4px;font-family:var(--body);font-weight:600}
.prov .g{font-size:9px;font-style:normal}
.figrow{display:flex;flex-direction:column;gap:2px}
.fig{display:inline-flex;align-items:baseline;gap:8px;flex-wrap:wrap}
input[type=text],input[type=number],input[type=date],select{width:100%;min-height:48px;background:var(--paper);border:1.5px solid var(--ink40);border-radius:12px;padding:0 14px;font:inherit;font-size:17px;color:var(--ink);font-variant-numeric:tabular-nums}
.field{display:flex;flex-direction:column;gap:6px}
.field>span{font-size:13px;line-height:18px;color:var(--ink64)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:44px;padding:0 16px;border:1.5px solid var(--ink40);border-radius:22px;font-size:15px;display:inline-flex;align-items:center;gap:6px}
.chip.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.chip.brand-on{background:var(--brand);color:#fff;border-color:var(--brand)}
/* waterline chart */
.wl{position:relative;padding:10px 34px 26px 2px;margin-right:-20px} /* right margin bleed: the line overshoots the grid */
.wl-plot{position:relative;display:flex;align-items:flex-end;gap:8px;height:170px}
.wl.small .wl-plot{height:96px}
.wl.small{margin-right:0;padding:8px 6px 4px 2px}
.wl.small .wl-plot{gap:3px}
.wl.small .wl-col{min-width:6px}
.wl.small .wl-line{right:-4px}
.wl.small .wl-line::after{display:none}
.wl-col{flex:1;position:relative;height:100%;display:flex;align-items:flex-end;min-width:14px}
.wl-bar{width:100%;background:var(--ink);border-radius:3px 3px 0 0}
.wl-gap{position:absolute;left:15%;width:70%;background:var(--short);border-radius:2px;opacity:.95}
.wl-line{position:absolute;left:-2px;right:-14px;border-top:2.5px solid var(--ink);pointer-events:none}
.wl-line::after{content:'';position:absolute;right:-1px;top:-5px;border:4px solid transparent;border-left:7px solid var(--ink)}
.wl-linelbl{position:absolute;right:0;transform:translateY(-21px);font-size:11px;letter-spacing:.06em;color:var(--ink);font-weight:700;font-variant-numeric:tabular-nums;background:var(--paper);padding:2px 5px;border-radius:5px;border:1.5px solid var(--ink14)}
.wl-x{display:flex;gap:8px;padding-top:6px}
.wl-x span{flex:1;text-align:center;font-size:11px;letter-spacing:.04em;color:var(--ink64);text-transform:uppercase;min-width:14px}
/* coverage strip */
.cov{display:flex;gap:5px;align-items:flex-end;height:44px}
.cov i{flex:1;display:block;border-radius:2px}
.cov i.rec{background:var(--ink)}
.cov i.unk{height:12px;border:1.5px dashed var(--caution);background:none}
/* range band */
.band{position:relative;height:64px;margin:8px 0 4px}
.band .track{position:absolute;left:0;right:0;top:18px;height:12px;border-radius:6px;background:var(--ink14)}
.band .fill{position:absolute;top:18px;height:12px;border-radius:6px;background:var(--ink)}
.band .pin{position:absolute;top:32px;transform:translateX(-50%);text-align:center;font-size:12px;line-height:16px;color:var(--ink);white-space:nowrap}
.band .pin::before{content:'▲';display:block;font-size:11px}
.note-c{border-left:4px solid var(--caution);padding:8px 12px;background:var(--card);border-radius:0 10px 10px 0}
.toast{position:absolute;left:20px;right:20px;bottom:84px;background:var(--ink);color:var(--paper);border-radius:12px;padding:12px 16px;display:flex;align-items:center;gap:10px;font-size:15px;z-index:30;opacity:0;transform:translateY(8px);transition:opacity .18s,transform .18s;pointer-events:none}
.toast.show{opacity:1;transform:none}
.toast .tick{color:var(--confirm);font-size:18px}
#tabbar{display:flex;border-top:1.5px solid var(--ink14);background:var(--paper);padding-bottom:env(safe-area-inset-bottom)}
#tabbar button{flex:1;min-height:60px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-family:var(--disp);font-weight:700;font-size:12px;letter-spacing:.04em;color:var(--ink64);border-top:3px solid transparent}
#tabbar button.on{color:var(--brand);border-top-color:var(--brand)}
#tabbar .ico{font-size:18px;line-height:1}
.sheetwrap{position:absolute;inset:0;z-index:40;display:flex;align-items:flex-end}
.scrim{position:absolute;inset:0;background:rgba(60,81,82,.45)}
.sheet{position:relative;width:100%;background:var(--paper);border-radius:20px 20px 0 0;padding:20px 20px calc(20px + env(safe-area-inset-bottom));max-height:70%;overflow-y:auto}
.sheet h3{font-family:var(--disp);font-size:19px;margin-bottom:12px}
.opt{display:flex;width:100%;min-height:52px;align-items:center;justify-content:space-between;font-size:17px;border-radius:12px;padding:0 12px}
.opt.on{background:var(--card);font-weight:600}
.ob{position:absolute;inset:0;z-index:50;background:var(--paper);display:flex;flex-direction:column;padding:24px 24px calc(24px + env(safe-area-inset-bottom))}
.ob .obcard{flex:1;display:flex;flex-direction:column;justify-content:center;gap:16px}
.dots{display:flex;gap:8px;justify-content:center;margin-bottom:20px}
.dots i{width:8px;height:8px;border-radius:50%;background:var(--ink14)}
.dots i.on{background:var(--brand)}
.mgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.mgrid button{min-height:48px;border:1.5px solid var(--ink40);border-radius:12px;font-size:14px}
.mgrid button.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.kv{display:flex;justify-content:space-between;align-items:baseline;gap:10px;min-height:32px}
.kv .k{font-size:15px;color:var(--ink)}
.kv .v{font-family:var(--disp);font-weight:700;font-variant-numeric:tabular-nums;font-size:16px;white-space:nowrap}
.editrow{display:flex;align-items:center;gap:10px}
.editrow .lbl{flex:1;font-size:15px}
.editrow input{width:104px;text-align:right;min-height:44px}
.divider{border:none;border-top:1.5px solid var(--ink14);margin:16px 0}
.badge{display:inline-flex;align-items:center;min-height:24px;padding:2px 10px;border-radius:12px;font-size:12px;font-weight:700;letter-spacing:.05em;text-transform:uppercase}
.badge.caution{background:var(--caution);color:var(--ink)}
.fromr{display:inline-flex;align-items:center;min-height:20px;padding:1px 8px;border:1.5px solid var(--caution);border-radius:10px;font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:var(--ink64);font-weight:600}
.shimmer{height:130px;border-radius:14px;background:linear-gradient(90deg,var(--card) 25%,#fff 50%,var(--card) 75%);background-size:200% 100%;animation:shm 1.1s linear infinite}
@keyframes shm{to{background-position:-200% 0}}
.hidden{display:none !important}
.reveal{overflow:hidden}
@media (prefers-reduced-motion:reduce){*{transition:none !important;animation:none !important}}
</style>
</head>

/* ================= i18n + format helpers ================= */
function t(k,vars){
  let s=(STRINGS[S.lang][k]!==undefined)?STRINGS[S.lang][k]:STRINGS.en[k];
  if(s===undefined) s='['+k+']';
  if(vars) for(const v in vars) s=s.split('{'+v+'}').join(vars[v]);
  return s;
}
function esc(x){return String(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function nf(v){return Math.round(v).toLocaleString('en-MY')}
function rm(v){return 'RM '+nf(v)}
function logoSvg(px){
  return '<svg width="'+px+'" height="'+px+'" viewBox="0 0 100 100" aria-hidden="true" focusable="false">'+

}

}

  return '<span class="fig"><span class="display '+(cls||'h-m')+'">'+esc(value)+'</span>'+prov(p)+'</span>';
}

/* ================= derived calculations ================= */
function rmx(v){const r=Math.round(v*100)/100;return Number.isInteger(r)?rm(r):'RM\u2009'+r.toFixed(2)}
function workCostTotal(){return S.data.workCosts.reduce((a,c)=>a+(+c.a||0),0)}
function expByMonth(){
  const map=new Map();
  for(const e of S.data.expenses){
    const key=(+e.d.slice(0,4))*12+(+e.d.slice(5,7)-1);
    if(!map.has(key)) map.set(key,{total:0,days:new Set()});
    const r=map.get(key); r.total+=(+e.a||0); r.days.add(e.d);
  }
  return map;
}
const EXP_FULL_DAYS=20;
function commitDaily(){const c=S.data.commitments;return [...c.living,...c.debts,...c.savings].filter(x=>x.dv).reduce((a,x)=>a+(+x.a||0),0)}
function commitFor(key){
  const e=expByMonth().get(key);
  if(e&&e.days.size>=EXP_FULL_DAYS) return commitTotal()-commitDaily()+e.total;
  return commitTotal();
}
function actualMonths(){
  const em=expByMonth();
  return monthsAgg().filter(r=>{const e=em.get(r.y*12+r.m);return e&&e.days.size>=EXP_FULL_DAYS;});
}
function commitTotal(){const c=S.data.commitments;return [...c.living,...c.debts,...c.savings].reduce((a,x)=>a+(+x.a||0),0)}
function monthsAgg(){
  const map=new Map();
  for(const e of S.data.income){
    const y=+e.d.slice(0,4), m=+e.d.slice(5,7)-1;
    const key=y*12+m;
    if(!map.has(key)) map.set(key,{y,m,gross:0});
    map.get(key).gross+=(+e.a||0);
  }
  const wc=workCostTotal();
  return [...map.values()].sort((a,b)=>(a.y*12+a.m)-(b.y*12+b.m))
    .map(r=>({...r, net:r.gross-wc, surplus:r.gross-wc-commitFor(r.y*12+r.m)}));
}
function instalment(P,rate,years){
  if(P<=0) return 0;
  const r=rate/1200, n=years*12;
  if(r===0) return P/n;
  return P*r/(1-Math.pow(1+r,-n));
}
function extrasTotal(){return S.data.homeCosts.reduce((a,c)=>a+(+c.a||0),0)}
function currentInstalment(){
  const h=S.data.house;
  if(h.knownPayment!=null) return +h.knownPayment;
  return instalment(Math.max(0,h.price-h.deposit),h.rate,h.years);
}
function totalHomeCost(){return currentInstalment()+extrasTotal()}
function priceForInstalment(M){
  const h=S.data.house, r=h.rate/1200, n=h.years*12;
  if(M<=0) return 0;
  if(r===0) return M*n;
  return M*(1-Math.pow(1+r,-n))/r;
}
function testRows(cost,shockPct){
  const f=1-(shockPct||0)/100;
  return monthsAgg().map(r=>{
    const surplus=(r.net*f)-commitFor(r.y*12+r.m);
    return {...r,surplus,short:surplus<cost,gap:Math.max(0,cost-surplus)};
  });
}
function carryRange(){
  const s=monthsAgg().map(r=>r.surplus).sort((a,b)=>a-b);
  if(!s.length) return null;
  const lo=s[0];
  const hi=(s.length%2)?s[(s.length-1)/2]:(s[s.length/2-1]+s[s.length/2])/2;
  return {lo,hi};
}
function bufferNeed(cost){
  let bal=0,min=0;
  const rows=monthsAgg().map(r=>{
    bal+=r.surplus-cost; if(bal<min)min=bal;
    return {y:r.y,m:r.m,bal};
  });
  return {need:Math.max(0,-min),rows};
}
function recSpan(){
  const a=monthsAgg();
  if(!a.length) return null;
  return {from:a[0],to:a[a.length-1],list:a};
}
function slowUnseen(){
  const sp=recSpan();
  if(!sp||S.coverage.answer!=='yes'||!S.coverage.slow.length) return [];
  const seen=new Set(sp.list.map(r=>r.m));
  return S.coverage.slow.filter(m=>!seen.has(m));
}
function upfrontNeed(){
  return S.data.house.deposit + S.data.upfront.reduce((a,c)=>a+(+c.a||0),0);
}

function go(r){S.stack.push(S.route);S.route=r;S.howOpen=false;S.rgHowOpen=false;render();document.getElementById('screen').scrollTop=0}
function preHousingOk(){
  const rows=testRows(0);
  return rows.length>0&&Math.min(...rows.map(r=>r.surplus))>=0;
}
function backNav(){
  const prev=S.stack.pop();
  if(prev){S.route=prev;render();return}
  const tab=TAB_OF[S.route]||'home';
  const root=(tab==='test')?(S.testRan?'result':'house'):tab;
  goTab(S.route===root?'home':tab);
}
function goTab(tab){
  S.stack=[];
  if(tab==='test') S.route=S.testRan?(preHousingOk()?'result':'precheck'):'house';
  else S.route=tab;
  render();document.getElementById('screen').scrollTop=0;
}
function runTest(){
  if(!preHousingOk()){go('precheck');return}
  S.testRan=true;
  go('result');
}
function startScanRead(thumb){
  S.scan={stage:'read',thumb};
  render();
  setTimeout(()=>{
    if(S.route!=='expscan'||S.scan.stage!=='read') return;
    S.scan={stage:'confirm',thumb,vals:{m:'Kedai Runcit Maju',d:S.expDraft.d,a:34.70,c:'groc'}};
    render();
  },1400);
}

  const el=document.getElementById('toast');

/* ================= shared view pieces ================= */
function header(opts){
  const back=opts.back?'<button class="iconbtn" data-act="back" aria-label="'+esc(t('back'))+'">←</button>':'';
  const title=opts.brand
    ?'<span class="brandmark" style="display:inline-flex;align-items:center;gap:9px">'+logoSvg(28)+'RuMampu</span>'
    :'<span class="ttl">'+esc(opts.title||'')+'</span>';
  return '<div class="hdr">'+back+title+
    '<button class="langbtn" data-act="lang" aria-label="'+esc(t('lang_pick'))+'">'+S.lang.toUpperCase()+' ▾</button></div>';
}
function waterline(rows,cost,opts){
  opts=opts||{};
  const max=Math.max(cost,...rows.map(r=>r.surplus),1)*1.12;
  const pct=v=>Math.max(0,v/max*100);
  let bars='';
  for(const r of rows){
    const h=pct(r.surplus);
    let gap='';
    if(r.short&&r.gap>0){
      gap='<i class="wl-gap" style="bottom:'+h+'%;height:'+(pct(cost)-h)+'%" aria-hidden="true"></i>';
    }
    bars+='<div class="wl-col"><i class="wl-bar" style="height:'+h+'%"></i>'+gap+'</div>';
  }
  const lbl=opts.lineLabel?'<span class="wl-linelbl" style="bottom:'+pct(cost)+'%">'+esc(rm(cost))+'</span>':'';
  const xs=opts.noLabels?'':'<div class="wl-x">'+rows.map(r=>'<span>'+esc(monthName(r.m))+'</span>').join('')+'</div>';
  const pv=opts.prov?'<div class="figrow">'+prov(opts.prov)+'</div>':'';
  return '<div class="wl'+(opts.small?' small':'')+'"><div class="wl-plot">'+bars+
    '<span class="wl-line" style="bottom:'+pct(cost)+'%"></span>'+lbl+'</div>'+xs+pv+'</div>';
}
function covStrip(){
  const sp=recSpan(); if(!sp) return '';
  const rec=new Map(sp.list.map(r=>[r.m,r]));
  const maxNet=Math.max(...sp.list.map(r=>r.net),1);
  let cells='';
  for(let m=0;m<12;m++){
    if(rec.has(m)) cells+='<i class="rec" style="height:'+Math.max(18,rec.get(m).net/maxNet*44)+'px" title="'+esc(monthName(m))+'"></i>';
    else cells+='<i class="unk" title="'+esc(monthName(m))+': '+esc(t('unknown'))+'"></i>';
  }
  return '<div class="cov" role="img" aria-label="'+esc(t('covspan',{a:monthName(sp.from.m),b:monthName(sp.to.m)}))+'">'+cells+'</div>';
}
function editList(list,onScreenPrefix){
  return list.map((c,i)=>
    '<div class="editrow"><span class="lbl">'+esc(c.custom?c.name:t(c.k))+'<br>'+prov(c.p||'user')+'</span>'+
    '<input type="number" inputmode="numeric" min="0" value="'+(+c.a||0)+'" data-edit="'+onScreenPrefix+'" data-i="'+i+'" aria-label="'+esc(c.custom?c.name:t(c.k))+'"></div>'
  ).join('');
}

    '<div>'+fig((left<0?'−':'')+rm(Math.abs(left)),'user','h-xl')+
    '<p class="body-s muted">'+esc(left<0?t('pv_shortby'):t('pv_left'))+'</p></div>'+
    '<div class="kv"><span class="k">'+esc(t('pv_in'))+'</span>'+fig(rm(cur.inc),'user')+'</div>'+
    '<div class="kv"><span class="k">'+esc(t('pv_out'))+'</span>'+fig(rm(cur.home),'user')+'</div>'+
    waterline(rows,cur.home,{lineLabel:true,prov:'user'})+
    '</div>';
},

pv_compare(){
  const cost=totalHomeCost();
  const rows=testRows(cost);
  const n=rows.length, s=rows.filter(r=>r.short).length;
  const am=S.data.after.months;
  const s2=am.filter(r=>r.inc<r.home).length;
  return header({back:1,title:t('pv_then')})+
    '<div class="stack"><span class="badge caution">'+esc(t('pv_banner'))+'</span>'+
    '<p class="display h-m">'+esc(t('pv_then_a',{s,n}))+'</p><div class="figrow">'+prov('calc')+'</div>'+
    '<p class="display h-m">'+esc(t('pv_then_b',{s2,n2:am.length}))+'</p><div class="figrow">'+prov('user')+'</div>'+
    '<hr class="divider">'+
    '<p class="body-s muted">'+esc(t('pv_then_why'))+'</p>'+
    '<p class="body-s muted">'+esc(t('pv_keep'))+'</p></div>';
}
};

/* ================= sheets & onboarding ================= */
function renderOverlay(){
  const o=document.getElementById('overlay');
  if(!S.onboarded){
    const cards=['ob1','ob2','ob3'];
    const i=S.onboard;
    o.innerHTML='<div class="ob">'+
      '<div style="display:flex;justify-content:space-between"><button class="langbtn" data-act="lang" aria-label="'+esc(t('lang_pick'))+'">'+S.lang.toUpperCase()+' ▾</button><button class="iconbtn" data-act="ob-skip" style="font-family:var(--disp);font-weight:700;font-size:15px;min-width:64px">'+esc(t('ob_skip'))+'</button></div>'+
      '<div class="obcard">'+logoSvg(84)+'<span class="brandmark display" style="font-size:24px">RuMampu</span>'+
      '<p class="display h-l">'+esc(t(cards[i]))+'</p></div>'+
      '<div class="dots">'+cards.map((_,j)=>'<i class="'+(j===i?'on':'')+'"></i>').join('')+'</div>'+
      '<button class="btn" data-act="ob-next">'+esc(i<2?t('ob_next'):t('ob_start'))+'</button></div>';
    return;
  }
  if(S.sheet==='lang'){
    o.innerHTML='<div class="sheetwrap"><div class="scrim" data-act="sheet-close"></div><div class="sheet">'+
      '<h3>'+esc(t('lang_pick'))+'</h3>'+
      ['en','ms','zh'].map(l=>'<button class="opt'+(S.lang===l?' on':'')+'" data-act="setlang" data-l="'+l+'">'+esc(STRINGS[l].langname)+(S.lang===l?' <span style="color:var(--brand)">✓</span>':'')+'</button>').join('')+
      '</div></div>';
    return;
  }
  if(S.sheet&&S.sheet.startsWith('prov:')){
    const p=S.sheet.slice(5);
    o.innerHTML='<div class="sheetwrap"><div class="scrim" data-act="sheet-close"></div><div class="sheet">'+
      '<h3><i class="g" style="font-style:normal;font-size:13px">'+PROV_G[p]+'</i> '+esc(t('prov_'+p))+'</h3>'+
      '<p class="body-s">'+esc(t('provf_'+p))+'</p>'+
      '<button class="btn" data-act="sheet-close" style="margin-top:16px">'+esc(t('done'))+'</button></div></div>';
    return;
  }
  if(S.sheet==='pastmonth'){
    const sp=recSpan();
    const firstKey=sp?sp.from.y*12+sp.from.m:2026*12+7;
    let opts='';
    for(let k=firstKey-1;k>=firstKey-6;k--){
      const y=Math.floor(k/12), m=k%12;
      opts+='<option value="'+y+'-'+String(m+1).padStart(2,'0')+'">'+esc(monthName(m)+' '+y)+'</option>';
    }
    o.innerHTML='<div class="sheetwrap"><div class="scrim" data-act="sheet-close"></div><div class="sheet stack-s">'+
      '<h3>'+esc(t('inc_past'))+'</h3>'+
      '<p class="body-s muted">'+esc(t('inc_past_hint'))+'</p>'+
      '<label class="field"><span>'+esc(t('inc_date'))+'</span><select id="past-m">'+opts+'</select></label>'+
      '<label class="field"><span>'+esc(t('inc_amount'))+'</span><input id="past-a" type="number" inputmode="numeric" min="0"></label>'+
      '<button class="btn" data-act="past-save">'+esc(t('add'))+'</button></div></div>';
    return;
  }
  if(S.sheet==='xcown'){
    o.innerHTML='<div class="sheetwrap"><div class="scrim" data-act="sheet-close"></div><div class="sheet stack-s">'+
      '<h3>'+esc(t('xc_own'))+'</h3>'+
      '<label class="field"><span>'+esc(t('src_name'))+'</span><input id="own-name" type="text"></label>'+
      '<button class="btn" data-act="own-save" data-kind="xc">'+esc(t('add'))+'</button></div></div>';
    return;
  }
  if(S.sheet==='srcown'||S.sheet==='wcown'){
    const isSrc=S.sheet==='srcown';
    o.innerHTML='<div class="sheetwrap"><div class="scrim" data-act="sheet-close"></div><div class="sheet stack-s">'+
      '<h3>'+esc(isSrc?t('src_own'):t('wc_own'))+'</h3>'+
      '<label class="field"><span>'+esc(t('src_name'))+'</span><input id="own-name" type="text"></label>'+
      (isSrc?'':'<label class="field"><span>'+esc(t('inc_amount'))+'</span><input id="own-amt" type="number" inputmode="numeric" min="0" value="0"></label>')+
      '<button class="btn" data-act="own-save" data-kind="'+(isSrc?'src':'wc')+'">'+esc(t('add'))+'</button></div></div>';
    return;
  }
  o.innerHTML='';
}

/* ================= render ================= */
function render(){
  document.documentElement.lang=S.lang==='zh'?'zh':(S.lang==='ms'?'ms':'en');
  const scr=document.getElementById('screen');
  scr.innerHTML=(SCREENS[S.route]||SCREENS.home)();
  const tab=TAB_OF[S.route]||'home';
  document.getElementById('tabbar').innerHTML=[
    ['home','⌂','tab_home'],['money','◔','tab_money'],['test','≟','tab_test'],['prepare','☰','tab_prepare']
  ].map(([id,ico,k])=>'<button class="'+(tab===id?'on':'')+'" data-act="tab" data-to="'+id+'" aria-current="'+(tab===id?'page':'false')+'"><span class="ico" aria-hidden="true">'+ico+'</span>'+esc(t(k))+'</button>').join('');
  renderOverlay();
}

/* ================= events ================= */
document.getElementById('phone').addEventListener('click',ev=>{
  const b=ev.target.closest('[data-act],[data-prov]');
  if(!b) return;
  if(b.dataset.prov){S.sheet='prov:'+b.dataset.prov;renderOverlay();return}
  const act=b.dataset.act;
  if(act==='back') backNav();
  else if(act==='go') go(b.dataset.to);
  else if(act==='tab') goTab(b.dataset.to);
  else if(act==='lang'){S.sheet='lang';renderOverlay()}
  else if(act==='setlang'){S.lang=b.dataset.l;S.sheet=null;render()}
  else if(act==='sheet-close'){S.sheet=null;renderOverlay()}
  else if(act==='ob-skip'){S.onboarded=true;renderOverlay()}
  else if(act==='ob-next'){if(S.onboard<2){S.onboard++;renderOverlay()}else{S.onboarded=true;renderOverlay()}}
  else if(act==='how'){S.howOpen=!S.howOpen;render()}
  else if(act==='rghow'){S.rgHowOpen=!S.rgHowOpen;render()}
  else if(act==='tc-toggle'){S.tcOpen=!S.tcOpen;render()}
  else if(act==='dc65'){S.dcOpen=!S.dcOpen;render()}
  else if(act==='dc-check'){const k=b.dataset.k;const i=S.docsChecked.indexOf(k);if(i>=0)S.docsChecked.splice(i,1);else S.docsChecked.push(k);render()}
  else if(act==='run') runTest();
  else if(act==='srcpick'){S.incomeDraft.s=b.dataset.id;render()}
  else if(act==='srcown'){S.sheet='srcown';renderOverlay()}
  else if(act==='own'){S.sheet=b.dataset.list==='wc'?'wcown':'srcown';renderOverlay()}
  else if(act==='own-save'){
    const name=(document.getElementById('own-name').value||'').trim();
    if(name){
      if(b.dataset.kind==='src'){
        const id='own'+Date.now();
        S.data.sources.push({id,custom:true,name});
        S.incomeDraft.s=id;
      }else if(b.dataset.kind==='xc'){
        const id='own'+Date.now();
        S.data.expenseCats.push({id,custom:true,name});
        S.expDraft.c=id;
      }else{
        S.data.workCosts.push({id:'own'+Date.now(),custom:true,name,a:+document.getElementById('own-amt').value||0});
      }
      S.sheet=null;toast(t('saved'));render();
    }
  }
  else if(act==='inc-add'||act==='inc-keep'){
    const a=+document.getElementById('inc-a')?.value||+S.incomeDraft.a||0;
    const d=document.getElementById('inc-d')?.value||S.incomeDraft.d;
    if(a<0){S.incomeDraft.flag='neg';S.incomeDraft.a=a;render();return}
    if(!a){document.getElementById('inc-a')?.focus();return}
    const amts=S.data.income.map(e=>e.a).sort((x,y)=>x-y);
    const med=amts.length?amts[Math.floor(amts.length/2)]:a;
    if(act==='inc-add'&&amts.length&&a>med*3){S.incomeDraft={...S.incomeDraft,a,d,flag:'outlier'};render();return}
    S.data.income.push({a,d,s:S.incomeDraft.s});
    S.data.income.sort((x,y)=>x.d<y.d?-1:1);
    S.incomeDraft={a:'',d,s:S.incomeDraft.s,flag:null};
    toast(t('entry_saved_n',{n:monthsAgg().length}));render();
  }
  else if(act==='cm-chip'){
    const id=b.dataset.id;
    const all={living:MOCK.commitments.living,debts:MOCK.commitments.debts,savings:MOCK.commitments.savings};
    for(const sec in all){
      const src=all[sec].find(x=>x.id===id);
      if(src){S.data.commitments[sec].push({...src});break}
    }
    toast(t('saved'));render();
  }
  else if(act==='cv-ans'){S.coverage.answer=b.dataset.v;render()}
  else if(act==='cv-m'){
    const m=+b.dataset.m;
    const i=S.coverage.slow.indexOf(m);
    if(i>=0)S.coverage.slow.splice(i,1);else S.coverage.slow.push(m);
    render();
  }
  else if(act==='h-known'){S.data.house.knownPayment=Math.round(currentInstalment());render()}
  else if(act==='h-unknown'){S.data.house.knownPayment=null;render()}
  else if(act==='shock'){S.shock=+b.dataset.v;S.sheet=null;render()}
  else if(act==='shock-custom'){S.sheet='shockcustom';render()}
  else if(act==='buy'){S.bought=true;toast(t('saved'));render()}
  else if(act==='inc-past'){S.sheet='pastmonth';renderOverlay()}
  else if(act==='past-save'){
    const v=document.getElementById('past-m').value, a=+document.getElementById('past-a').value||0;
    if(a>0&&/^\d{4}-\d{2}$/.test(v)){
      S.data.income.push({a,d:v+'-15',s:S.incomeDraft.s});
      S.data.income.sort((x,y)=>x.d<y.d?-1:1);
      S.sheet=null;toast(t('entry_saved_n',{n:monthsAgg().length}));render();
    }
  }
  else if(act==='keep-test'){
    const cost=totalHomeCost(), rows=testRows(cost);
    S.keptTests.push({pay:Math.round(cost),s:rows.filter(r=>r.short).length,n:rows.length,g:Math.round(Math.max(...rows.map(r=>r.gap),0))});
    toast(t('rs_kept'));
  }
  else if(act==='excat'){S.exCatOpen=!S.exCatOpen;render()}
  else if(act==='exmonth'){const k=+b.dataset.k;S.exMonthOpen=S.exMonthOpen===k?null:k;render()}
  else if(act==='xcpick'){S.expDraft.c=b.dataset.id;render()}
  else if(act==='xcown'){S.sheet='xcown';renderOverlay()}
  else if(act==='ex-save'){
    const a=+document.getElementById('ex-a').value||0;
    const d=document.getElementById('ex-d').value||S.expDraft.d;
    if(a<=0){document.getElementById('ex-a').focus();return}
    S.data.expenses.push({a,d,c:S.expDraft.c});
    S.expDraft={a:'',c:S.expDraft.c,d};
    const key=(+d.slice(0,4))*12+(+d.slice(5,7)-1);
    const e=expByMonth().get(key);
    toast(t('ex_saved',{m:monthName(key%12),x:nf(e.total)}));
    backNav();
  }
  else if(act==='scan-sample'){startScanRead(null)}
  else if(act==='scan-retake'){S.scan={stage:'pick'};render()}
  else if(act==='scan-save'){
    const a=+document.getElementById('sc-a').value||0;
    const d=document.getElementById('sc-d').value||S.expDraft.d;
    const c=document.getElementById('sc-c').value;
    if(a<=0){document.getElementById('sc-a').focus();return}
    S.data.expenses.push({a,d,c});
    S.scan={stage:'pick'};
    const key=(+d.slice(0,4))*12+(+d.slice(5,7)-1);
    toast(t('ex_saved',{m:monthName(key%12),x:nf(expByMonth().get(key).total)}));
    S.route='expenses';render();
  }
});
document.getElementById('phone').addEventListener('input',ev=>{
  const el=ev.target;
  if(el.id==='ex-file'&&el.files&&el.files[0]){
    let thumb=null;
    try{thumb=URL.createObjectURL(el.files[0])}catch(err){}
    startScanRead(thumb);return;
  }
  if(el.id==='ex-a')S.expDraft.a=el.value;
  if(el.id==='ex-d')S.expDraft.d=el.value;
  if(el.id==='inc-a')S.incomeDraft.a=el.value;
  if(el.id==='inc-d')S.incomeDraft.d=el.value;
  if(el.id==='h-price'){S.data.house.price=+el.value||0;softUpdate()}
  if(el.id==='h-dep'){S.data.house.deposit=Math.max(0,+el.value||0);softUpdate()}
  if(el.id==='h-rate'){S.data.house.rate=+el.value||0;softUpdate()}
  if(el.id==='h-ten'){S.data.house.years=+el.value||1;softUpdate()}
  if(el.id==='h-kp'){S.data.house.knownPayment=+el.value||0}
  if(el.id==='sh-p'){S.shock=Math.min(90,Math.max(0,+el.value||0));softUpdate()}
  const listMap={wc:S.data.workCosts,hc:S.data.homeCosts,uf:S.data.upfront,
    cml:S.data.commitments.living,cmd:S.data.commitments.debts,cms:S.data.commitments.savings,cp:S.data.comparePayments};
  if(el.dataset.edit){
    const list=listMap[el.dataset.edit], i=+el.dataset.i;
    if(el.dataset.edit==='cp') list[i]=Math.max(0,+el.value||0);
    else if(list&&list[i]) list[i].a=Math.max(0,+el.value||0);
    softUpdate();
  }
});
/* re-render derived figures without stealing focus from the input being typed in */
let softTimer=null;
function softUpdate(){
  clearTimeout(softTimer);
  softTimer=setTimeout(()=>{
    const el=document.activeElement;
    const id=el&&el.id, de=el&&el.dataset?el.dataset.edit:null, di=el&&el.dataset?el.dataset.i:null;
    const pos=el&&el.selectionStart;
    render();
    let again=null;
    if(id) again=document.getElementById(id);
    else if(de!=null&&di!=null) again=document.querySelector('[data-edit="'+de+'"][data-i="'+di+'"]');
    if(again){again.focus();try{if(pos!=null)again.setSelectionRange(pos,pos)}catch(e){}}
  },600);
}

/* audit hook, used by the self-audit script, not by the product UI */
window.__audit={
  routes:['home','money','income','workcosts','commit','pattern','coverage','record','expenses','expadd','expscan','expmonths','house','homecost','precheck','result','range','compare','shock','prepare','upfront','buffer','docs','pv_switch','pv_month','pv_compare'],
  goto(r){S.onboarded=true;S.testRan=true;S.bought=true;S.sheet=null;S.howOpen=false;S.rgHowOpen=false;S.tcOpen=false;S.dcOpen=false;S.scan={stage:'pick'};S.exCatOpen=false;S.route=r;render()},
  setLang(l){S.lang=l;render()},
  ob(){S.onboarded=false;S.onboard=0;render()}
};

render();
